pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = "AVFMux"

// The Android app itself is built by Soong from Android.bp inside the AOSP tree:
// its sources need platform_apis and Soong-only static libs that no public SDK or
// Maven repository provides. Only the pure registry logic is buildable here.
include ':logic'
