name: Build

on:
  push:
    branches:
      - main
      - 'wallentx/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avfmux-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  logic-and-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # The Android app itself is a Soong `platform_apis: true` module and cannot be assembled
      # against the public SDK. CI compiles and runs the new, pure registry logic on the JVM.
      - name: Compile and test registry logic
        run: ./gradlew :logic:test --console=plain

      - name: Verify Soong and manifest invariants
        shell: bash
        run: |
          set -euo pipefail
          manifest=app/src/main/AndroidManifest.xml

          grep -q 'android.permission.MANAGE_VIRTUAL_MACHINE' "$manifest"
          grep -q 'android.permission.USE_CUSTOM_VIRTUAL_MACHINE' "$manifest"
          grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' "$manifest"
          grep -q 'android:name=".GuestListActivity"' "$manifest"

          grep -q 'platform_apis: true' Android.bp
          grep -q 'privileged: true' Android.bp
          grep -q 'framework-virtualization.impl' Android.bp
          grep -q 'debian-service-grpclib-lite' Android.bp
          grep -q 'com.android.virt' Android.bp

      # The registry must never declare a device-specific, shell-owned storage path as a guest
      # source: external guests come only from a caller-supplied descriptor directory.
      - name: Verify no shell-owned path literal in registry
        shell: bash
        run: |
          set -euo pipefail
          ! grep -rn '/data/local/tmp' app/src/main/java/com/android/virtualization/terminal/GuestRegistry.kt
          ! grep -rn '/data/local/tmp' app/src/main/java/com/android/virtualization/terminal/

      - name: Preserve test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logic-test-reports
          path: |
            logic/build/test-results/**
            logic/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
