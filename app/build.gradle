plugins {
    id 'com.android.application'
}

android {
    namespace 'com.android.virtualization.terminal'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId "com.android.virtualization.terminal"
        minSdk 35
        targetSdk 37
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
        aidl true
        // Upstream has no custom Views inflating via generated binding classes;
        // layouts are inflated with findViewById. Keep viewBinding off.
        viewBinding false
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Mirrors the static_libs / libs list in upstream Android.bp
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.navigation:navigation-fragment-ktx:2.9.5"
    implementation "androidx.window:window:1.4.0"
    implementation "androidx.work:work-runtime:2.10.5"
    implementation "androidx.startup:startup-runtime:1.2.0"
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"
    implementation "com.google.android.material:material:1.13.0"
    implementation "com.google.code.gson:gson:2.13.2"
    implementation "org.apache.commons:commons-compress:1.28.0"

    testImplementation "junit:junit:4.13.2"
}
